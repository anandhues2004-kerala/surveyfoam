<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>surveyform</h1>
    <fieldset>
            <h4>name</h4>
    <input type="text" placeholder="enter your name">
    <div>
        <h4>email</h4>
        <input type="email" placeholder="enter your email">
    </div>
    <div>
        <h4>age(optional)</h4> 
        <input type="number" placeholder="entery">
    </div>
    <div>
        <h4>which option best describe your current role</h4>
    </div>
    <div>
        <select name="text" id="text">
            <option value="select_current_role">select_current_role</option>
            <option value="role1">role1</option>
            <option value="role2">role2</option>

        </select>

    </fieldset>

    <fieldset>
        <h4>was the session interactive</h4>
        <form >
  <input type="radio" id="yes" value="yes" name="survey">
  <label for="yes">yes</label>
  <div>
    <input type="radio" id="no" value="no" name="survey">
  <label for="no">no</label>
  <fieldset>
    <p>what would you like to see improved</p>
    <form >
        <input type="checkbox" value="more project">
        <label for="more project">more project</label>
        <input type="checkbox" value="student recap">
        <label for="student recap">student recap</label>
        <input type="checkbox" value="live q a">
        <label for="live qa">live qa</label>
        <input type="checkbox" value="less home work">
        <label for="less home work">less home work</label>

    </form>
  </fieldset>
    <textarea rows="3" cols="30" placeholder="write your comments"></textarea>
  </fieldset>
  <input type="submit">



   

    
</body>
